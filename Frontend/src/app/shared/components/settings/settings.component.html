<div class="settings-container">
  <!-- Color Theme Setting Item -->
  <div class="setting-item">
    <label for="theme-mode-select" class="setting-label">
      Color Theme
    </label>
    <select
      id="theme-mode-select"
      class="setting-select"
      [value]="settingsService.themeMode()"
      (change)="onThemeModeChange($event)"
    >
      @for (option of settingsService.themeOptions; track option.value) {
        <option [value]="option.value">
          {{ option.label }}
        </option>
      }
    </select>

    @if (themeAttemptMessage(); as warningMsg) {
      <div class="unsupported-alert">
        <span>⚠️ {{ warningMsg }}</span>
      </div>
    }

    <p class="setting-description">
      @for (option of settingsService.themeOptions; track option.value) {
        @if (option.value === settingsService.themeMode()) {
          {{ option.description }}
        }
      }
    </p>
  </div>
</div>
