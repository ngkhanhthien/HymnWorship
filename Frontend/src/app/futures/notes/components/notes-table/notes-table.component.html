<div class="table-responsive">
  <table class="notes-table">
    <thead>
      <tr>
        <th class="col-date">Date</th>
        <th class="col-hymn">Hymn #</th>
        <th class="col-topic">Topic</th>
        <th class="col-content">Content</th>
        <th class="col-time">Time</th>
        <th class="col-actions">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (item of notes; track item.id) {
        <tr class="table-row">
          <td class="col-date font-medium">{{ formatDate(item.date) }}</td>
          <td class="col-hymn">
            <span class="hymn-badge">#{{ item.hymnNumber }}</span>
          </td>
          <td class="col-topic">
            <span class="topic-tag" [attr.data-topic]="item.topic">
              {{ item.topic }}
            </span>
          </td>
          <td class="col-content">{{ item.content }}</td>
          <td class="col-time muted-text">{{ formatTime(item.createdAt) }}</td>
          <td class="col-actions">
            <div class="action-buttons">
              <!-- Edit Icon Button (UI action placeholder) -->
              <button
                type="button"
                class="action-btn edit-btn"
                title="Edit Note"
                (click)="onEdit(item)"
                aria-label="Edit Note"
              >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon">
                  <path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                </svg>
              </button>

              <!-- Delete Icon Button (UI action placeholder) -->
              <button
                type="button"
                class="action-btn delete-btn"
                title="Delete Note"
                (click)="onDelete(item.id)"
                aria-label="Delete Note"
              >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon">
                  <path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                </svg>
              </button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="empty-table-msg">
            No notes recorded yet. Add your first sacred note from any Hymn page!
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
